{% set version = "0.4.2" %}

package:
  name: entrypoints
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/e/entrypoints/entrypoints-{{ version }}.tar.gz
  sha256: 3bebd9a2cd05e08b123be74c277b36de4a38e899dba6a84ac9962ebe0c22ece6

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv"

requirements:
  host:
    - python {{ python_min }}
    - pip
    - flit
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - entrypoints

about:
  home: https://entrypoints.readthedocs.io/
  license: MIT
  license_file: LICENSE
  summary: Discover and load entry points from installed packages

extra:
  recipe-maintainers:
    - pelson
    - minrk
    - takluyver
    - ocefpaf
