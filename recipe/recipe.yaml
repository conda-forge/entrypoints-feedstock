schema_version: 1

context:
  version: "0.4.2"

package:
  name: entrypoints
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/e/entrypoints/entrypoints-${{ version }}.tar.gz
  sha256: 3bebd9a2cd05e08b123be74c277b36de4a38e899dba6a84ac9962ebe0c22ece6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=2,<5
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - entrypoints
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Discover and load entry points from installed packages.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/takluyver/entrypoints
  documentation: https://entrypoints.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - pelson
    - minrk
    - takluyver
    - ocefpaf
